[workspace]
members = ["actor", "channel", "serviceless", "tokio"]
resolver = "2"

[workspace.dependencies]
async-trait = "0.1.80"
log = "0.4.20"
thiserror = "2.0.17"
futures-channel = "0.3"
futures-core = "0.3"
futures-sink = "0.3"
futures-util = "0.3"
tokio = { version = "1.37.0", default-features = false }

serviceless-actor = { path = "./actor", version = "0.5.0" }
serviceless-tokio = { path = "./tokio", version = "0.1.0" }
