[workspace]
members = ["actor", "tokio", "serviceless"]
resolver = "2"

[workspace.dependencies]
serviceless-actor = { path = "actor", version = "0.6.1" }
serviceless-tokio = { path = "tokio", version = "0.6.1" }
async-trait = "0.1.80"
tracing = "0.1.44"
thiserror = "2.0.17"
futures-core = "0.3"
futures-util = "0.3"
tokio = { version = "1.37.0", default-features = false }
prometheus-client = "0.25.0"
