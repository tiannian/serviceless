[package]
name = "serviceless-jsonrpc"
version.workspace = true
edition = "2021"
description = "Transport-independent JSON-RPC 2.0 router for Serviceless actors"
license = "MIT"

[dependencies]
serviceless = { path = "../serviceless", version = "0.7.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
async-trait = { workspace = true }
