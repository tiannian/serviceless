[package]
name = "serviceless-jsonrpc-server"
version.workspace = true
edition.workspace = true
description = "HTTP, WebSocket, Unix socket, and stdio transports for Serviceless JSON-RPC"
license.workspace = true

[dependencies]
serviceless-jsonrpc = { path = "../core", version = "0.7.0" }
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }
hyper-tungstenite = "0.20"
http-body-util = "0.1"
tokio = { workspace = true, features = ["io-util", "io-std", "net", "rt", "macros", "sync"] }
futures-util = { workspace = true, features = ["sink"] }
serde_json = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
serviceless = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }
tokio-tungstenite = { version = "0.29", features = ["connect"] }
hyper = { version = "1", features = ["client"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy"] }
