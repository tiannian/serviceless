[package]
name = "serviceless-jsonrpc-server"
version.workspace = true
edition.workspace = true
description = "HTTP, WebSocket, Unix socket, and stdio transports for Serviceless JSON-RPC"
license.workspace = true

[features]
default = []
tcp = ["dep:hyper", "dep:hyper-util", "dep:hyper-tungstenite", "dep:http-body-util", "tokio/net", "futures-util/sink", "dep:tracing"]
unix = ["dep:hyper", "dep:hyper-util", "dep:hyper-tungstenite", "dep:http-body-util", "tokio/net", "futures-util/sink", "dep:tracing"]
unixlines = ["tokio/net", "dep:tracing"]

[dependencies]
serviceless-jsonrpc = { path = "../core", version = "0.7.0" }
hyper = { version = "1", optional = true, features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", optional = true, features = ["server-auto", "tokio"] }
hyper-tungstenite = { version = "0.20", optional = true }
http-body-util = { version = "0.1", optional = true }
tokio = { workspace = true, features = ["io-util", "io-std", "rt", "macros", "sync"] }
futures-util = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
http-body-util = "0.1"
serviceless = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }
tokio-tungstenite = { version = "0.29", features = ["connect"] }
hyper = { version = "1", features = ["client"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy"] }

[[example]]
name = "topic_notifications"
required-features = ["tcp"]

[[example]]
name = "websocket_client"
required-features = ["tcp"]
