[package]
name = "serviceless"
version = "0.6.1"
edition = "2021"
description = "Async actor library with a Tokio runtime"
license = "MIT"
readme = "../README.md"

[dependencies]
serviceless-actor = { workspace = true }
serviceless-tokio = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
futures-util = { workspace = true }
tokio = { workspace = true, features = [
    "rt",
    "sync",
    "macros",
    "rt-multi-thread",
    "time",
] }
