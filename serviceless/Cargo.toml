[package]
name = "serviceless"
version.workspace = true
edition.workspace = true
description = "Async actor library with a Tokio runtime"
license.workspace = true
readme = "README.md"

[dependencies]
serviceless-actor = { workspace = true }
serviceless-tokio = { workspace = true }
serviceless-macros = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
futures-util = { workspace = true }
tokio = { workspace = true, features = [
    "rt",
    "sync",
    "macros",
    "rt-multi-thread",
    "time",
] }
